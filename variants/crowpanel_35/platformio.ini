[crowpanel_35]
extends = esp32_base
board = crowpanel
build_flags =
  ${esp32_base.build_flags}
  -I variants/crowpanel_35
  -D CROWPANEL_35
  -D P_LORA_NSS=0
  -D P_LORA_DIO_1=1
  -D P_LORA_RESET=2
  -D P_LORA_MOSI=3
  -D P_LORA_MISO=9
  -D P_LORA_SCLK=10
  -D P_LORA_BUSY=46
  -D PIN_BOARD_SDA=15
  -D PIN_BOARD_SCL=16
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=3.3
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D LORA_TX_POWER=22
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/crowpanel_35>
  +<helpers/sensors>
lib_deps =
  ${esp32_base.lib_deps}

[env:crowpanel_35_companion_radio_ble]
extends = crowpanel_35
build_flags =
  ${crowpanel_35.build_flags}
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D OFFLINE_QUEUE_SIZE=256
  -D PIN_BUZZER=8
  -D MESH_DEBUG=1
build_src_filter = ${crowpanel_35.build_src_filter}
  +<helpers/esp32/*.cpp>
  +<helpers/ui/buzzer.cpp>
  +<../examples/companion_radio/*.cpp>
lib_deps =
  ${crowpanel_35.lib_deps}
  densaugeo/base64 @ ~1.4.0
  end2endzone/NonBlockingRTTTL @ ^1.3.0
